services:
  postgres:
    image: postgres:16-alpine
    container_name: enrichly-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_automation}
      POSTGRES_USER: ${POSTGRES_USER:-job_automation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_automation_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-job_automation} -d ${POSTGRES_DB:-job_automation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/JobAutomationPlatform.Api/Dockerfile
    container_name: enrichly-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${ConnectionStrings__Default:-Host=postgres;Port=5432;Database=job_automation;Username=job_automation;Password=job_automation_dev}
      Jwt__Issuer: ${Jwt__Issuer:-Enrichly}
      Jwt__Audience: ${Jwt__Audience:-Enrichly}
      Jwt__SigningKey: ${Jwt__SigningKey:-replace-with-a-long-random-secret-at-least-32-chars}
      Jwt__TokenMinutes: ${Jwt__TokenMinutes:-720}
      Session__SessionDays: ${Session__SessionDays:-7}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: src/JobAutomationPlatform.Worker/Dockerfile
    container_name: enrichly-worker
    environment:
      ConnectionStrings__Default: ${ConnectionStrings__Default:-Host=postgres;Port=5432;Database=job_automation;Username=job_automation;Password=job_automation_dev}
      Worker__PollingIntervalSeconds: ${Worker__PollingIntervalSeconds:-5}
      Worker__HeartbeatIntervalSeconds: ${Worker__HeartbeatIntervalSeconds:-5}
      Worker__StaleAfterMinutes: ${Worker__StaleAfterMinutes:-2}
      Worker__RetryBaseDelaySeconds: ${Worker__RetryBaseDelaySeconds:-30}
      Worker__RetryMaxDelaySeconds: ${Worker__RetryMaxDelaySeconds:-600}
      Worker__SchedulerIntervalSeconds: ${Worker__SchedulerIntervalSeconds:-15}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: enrichly-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
